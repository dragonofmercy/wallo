[package]
name = "wallo"
version = "1.1.3"
description = "Windows wallpaper manager"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wallo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.3"
auto-launch = "0.6"
tauri-plugin-dialog = "2.7.3"
base64 = "0.23.1"
imageproc = "0.25.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-updater = "2.12.0"

# Image decode/resize is 10-50x slower unoptimized: optimize even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
